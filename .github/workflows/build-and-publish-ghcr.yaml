---
name: "Build and publish BaSyx server images to GHCR"
run-name: "Build and publish BaSyx server images to GHCR from ${{ github.ref_name }}"

on:
  # Automatischer Build bei jedem Push auf develop (Default-Branch) und bei Tags (z.B. v1.0.0)
  push:
    branches:
      - develop
    tags:
      - "v*"
    paths:
      - "sdk/**"
      - "server/**"
      - ".github/workflows/build-and-publish-ghcr.yaml"
  # Manueller Start ueber die Actions-UI
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Optionaler zusaetzlicher Docker-Tag (SHA und latest werden automatisch gesetzt)"
        required: false
        type: string

# GHCR-Registry: die Images landen unter ghcr.io/<owner>/<imagename>
env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-and-push:
    name: "Build & push ${{ matrix.variant.img }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # noetig fuer den Push nach GHCR
    strategy:
      fail-fast: false
      matrix:
        # dir = Dockerfile-Verzeichnis unter server/docker, img = GHCR-Imagename
        variant:
          - { dir: repository, img: basyx-python-repository }
          - { dir: discovery,  img: basyx-python-discovery }
          - { dir: registry,   img: basyx-python-registry }
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      ###############################################
      # Cross-arch Builds (amd64 + arm64)
      ###############################################
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      #####################
      # Login bei GHCR
      #####################
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      ###############################
      # Docker-Metadaten / Tags
      ###############################
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.variant.img }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.docker_tag }},enable=${{ inputs.docker_tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=BaSyx Python ${{ matrix.variant.dir }} Service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/tree/main/server
            org.opencontainers.image.licenses=MIT

      ###############################
      # Image bauen und pushen
      #   Kontext = Repo-Root, da die Dockerfiles ./sdk und ./server/** kopieren
      ###############################
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./server/docker/${{ matrix.variant.dir }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
