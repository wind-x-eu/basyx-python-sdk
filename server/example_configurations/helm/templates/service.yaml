{{- $root := . -}}
{{- range $name, $comp := .Values.components }}
{{- if $comp.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "basyx.componentName" (dict "root" $root "name" $name) }}
  labels:
    {{- include "basyx.labels" (dict "root" $root "name" $name) | nindent 4 }}
spec:
  type: {{ $root.Values.service.type }}
  ports:
    - port: {{ $root.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "basyx.selectorLabels" (dict "root" $root "name" $name) | nindent 4 }}
{{- end }}
{{- end }}
